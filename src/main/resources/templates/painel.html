<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Painel</title>
</head>
<body style="font-family: sans-serif; margin: 30px;">

    <a th:href="@{/}">← Voltar ao Menu Principal</a>
    <h2 th:text="${titulo}">Gerenciamento</h2>

    <h3>Cadastrar Novo</h3>
    <form th:action="${urlSalvar}" method="post" style="margin-bottom: 30px;">
        
        <div th:if="${tipo == 'hotel'}">
            <input type="text" name="nome" placeholder="Nome" />
            <input type="text" name="endereco" placeholder="Endereço" />
            <input type="text" name="telefone" placeholder="Telefone" />
        </div>

        <div th:if="${tipo == 'quarto'}">
            <input type="text" name="numero" placeholder="Número" />
            <input type="text" name="capacidade" placeholder="Capacidade" />
            <input type="text" name="valorDiaria" placeholder="Valor Diária" />
        </div>

        <div th:if="${tipo == 'hospede'}">
            <input type="text" name="nome" placeholder="Nome" />
            <input type="text" name="cpf" placeholder="CPF" />
            <input type="text" name="telefone" placeholder="Telefone" />
            <input type="text" name="email" placeholder="E-mail" />
        </div>

        <div th:if="${tipo == 'funcionario'}">
            <input type="text" name="nome" placeholder="Nome" />
            <input type="text" name="cpf" placeholder="CPF" />
            <input type="text" name="cargo" placeholder="Cargo" />
            <input type="text" name="salario" placeholder="Salário" />
        </div>

        <div th:if="${tipo == 'servico'}">
            <input type="text" name="nome" placeholder="Nome do Serviço" />
            <input type="text" name="descricao" placeholder="Descrição" />
            <input type="text" name="valor" placeholder="Valor (R$)" />
        </div>

		<div th:if="${tipo == 'reserva'}">
            <label>Data Entrada:</label> <input type="date" name="dataEntrada" /><br><br>
            <label>Data Saída:</label> <input type="date" name="dataSaida" /><br><br>
            <label>ID Hóspede:</label> <input type="number" name="hospede.id" /><br><br>
            <label>ID Quarto:</label> <input type="number" name="quarto.id" /><br><br>
            <label>Valor Total:</label> <input type="number" step="any" name="valorTotal" /><br><br>
        </div>

        <br>
        <button type="submit">Salvar</button>
    </form>

    <hr>

    <h3>Cadastrados</h3>
    <table border="1" cellpadding="8" style="border-collapse: collapse; width: 100%;">
        
        <tbody th:if="${tipo == 'hotel'}">
            <tr><th>ID</th><th>Nome</th><th>Endereço</th><th>Telefone</th></tr>
            <tr th:each="item : ${lista}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.nome}"></td>
                <td th:text="${item.endereco}"></td>
                <td th:text="${item.telefone}"></td>
            </tr>
        </tbody>

        <tbody th:if="${tipo == 'quarto'}">
            <tr><th>ID</th><th>Número</th><th>Capacidade</th><th>Diária</th></tr>
            <tr th:each="item : ${lista}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.numero}"></td>
                <td th:text="${item.capacidade}"></td>
                <td th:text="${item.valorDiaria}"></td>
            </tr>
        </tbody>

        <tbody th:if="${tipo == 'hospede'}">
            <tr><th>ID</th><th>Nome</th><th>CPF</th><th>Telefone</th><th>E-mail</th></tr>
            <tr th:each="item : ${lista}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.nome}"></td>
                <td th:text="${item.cpf}"></td>
                <td th:text="${item.telefone}"></td>
                <td th:text="${item.email}"></td>
            </tr>
        </tbody>

        <tbody th:if="${tipo == 'funcionario'}">
            <tr><th>ID</th><th>Nome</th><th>CPF</th><th>Cargo</th><th>Salário</th></tr>
            <tr th:each="item : ${lista}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.nome}"></td>
                <td th:text="${item.cpf}"></td>
                <td th:text="${item.cargo}"></td>
                <td th:text="${item.salario}"></td>
            </tr>
        </tbody>

        <tbody th:if="${tipo == 'servico'}">
            <tr><th>ID</th><th>Nome</th><th>Descrição</th><th>Valor</th></tr>
            <tr th:each="item : ${lista}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.nome}"></td>
                <td th:text="${item.descricao}"></td>
                <td th:text="${item.valor}"></td>
            </tr>
        </tbody>

        <tbody th:if="${tipo == 'reserva'}">
            <tr><th>ID</th><th>Hóspede</th><th>Quarto</th><th>Entrada</th><th>Saída</th><th>Valor Total</th></tr>
            <tr th:each="item : ${lista}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.hospede != null ? item.hospede.nome : '-'}"></td>
                <td th:text="${item.quarto != null ? item.quarto.numero : '-'}"></td>
                <td th:text="${item.dataEntrada}"></td>
                <td th:text="${item.dataSaida}"></td>
                <td th:text="${item.valorTotal}"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
